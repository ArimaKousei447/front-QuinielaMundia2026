<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1 class="logo">Quiniela Mundial 2026</h1>
      <p class="subtitle" *ngIf="!isRegister()">Predicciones de Fútbol</p>
      <p class="subtitle" *ngIf="isRegister()">Crea tu cuenta</p>
    </div>

    <div *ngIf="error()" class="error-banner">{{ error() }}</div>

    <form *ngIf="!isRegister()" class="form-group">
      <div class="input-wrapper">
        <label for="email">Email</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" [ngModelOptions]="{standalone: true}" placeholder="usuario@ejemplo.com" />
      </div>
      <div class="input-wrapper">
        <label for="password">Contraseña</label>
        <input type="password" id="password" [(ngModel)]="contrasena" name="contrasena" [ngModelOptions]="{standalone: true}" placeholder="••••••••" />
      </div>
      <button type="button" class="btn-primary" (click)="submitLogin()" [disabled]="loading()">
        <span *ngIf="!loading()">Entrar</span>
        <span *ngIf="loading()">Verificando...</span>
      </button>
      <button type="button" class="btn-secondary" (click)="toggleMode()">
        ¿No tienes cuenta? Regístrate
      </button>
    </form>

    <form *ngIf="isRegister()" class="form-group">
      <div class="input-wrapper">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" [(ngModel)]="nombre" name="nombre" [ngModelOptions]="{standalone: true}" placeholder="Tu nombre" />
      </div>
      <div class="input-wrapper">
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" [(ngModel)]="regEmail" name="regEmail" [ngModelOptions]="{standalone: true}" placeholder="usuario@ejemplo.com" />
      </div>
      <div class="input-wrapper">
        <label for="reg-password">Contraseña</label>
        <input type="password" id="reg-password" [(ngModel)]="regContrasena" name="regContrasena" [ngModelOptions]="{standalone: true}" placeholder="••••••••" />
      </div>
      <button type="button" class="btn-primary" (click)="submitRegister()" [disabled]="loading()">
        <span *ngIf="!loading()">Registrarse</span>
        <span *ngIf="loading()">Creando...</span>
      </button>
      <button type="button" class="btn-secondary" (click)="toggleMode()">
        ¿Ya tienes cuenta? Inicia sesión
      </button>
    </form>
  </div>
</div>
